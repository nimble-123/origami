name: origami
description: Check or format ABAP and CDS sources with origami, a layout-only formatter.
branding:
  icon: check-square
  color: blue

inputs:
  version:
    description: >
      Release tag (e.g. v1.0.0) or "latest". Default - the tag this action is
      used at; when the action is used at a commit SHA, a branch or a floating
      ref, the newest release is installed and a warning says so. Set this
      input to pin the binary version.
    default: ""
  args:
    description: Arguments for origami.
    default: --check
  sarif:
    description: Also upload the diagnostics to GitHub code scanning ("true" / "false").
    default: "false"
  token:
    description: Token for downloading the release.
    default: ${{ github.token }}
  require-attestation:
    description: >
      Fail if the release binary has no build provenance attestation
      ("true" / "false"). Releases before provenance was added have none; by
      default only a warning is printed for them. A binary that has an
      attestation must always verify.
    default: "false"

runs:
  using: composite
  steps:
    - name: Download origami
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        ACTION_REF: ${{ github.action_ref }}
        REPO: ${{ github.action_repository }}
        OS: ${{ runner.os }}
        ARCH: ${{ runner.arch }}
        REQUIRE_ATTESTATION: ${{ inputs.require-attestation }}
      run: |
        set -euo pipefail
        case "$OS-$ARCH" in
          Linux-X64) triple=x86_64-unknown-linux-gnu ;;
          Linux-ARM64) triple=aarch64-unknown-linux-gnu ;;
          macOS-X64) triple=x86_64-apple-darwin ;;
          macOS-ARM64) triple=aarch64-apple-darwin ;;
          Windows-X64) triple=x86_64-pc-windows-msvc ;;
          Windows-ARM64) triple=aarch64-pc-windows-msvc ;;
          *) echo "origami: unsupported runner $OS-$ARCH" >&2; exit 1 ;;
        esac
        tag="$VERSION"
        if [ -z "$tag" ]; then
          if [[ "$ACTION_REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            tag="$ACTION_REF"
          else
            tag=latest
            echo "::warning title=origami::The action is used at '${ACTION_REF:-a local path}', which is not a version tag like v1.2.3, so the newest release binary is installed and the version changes with every release. Pin it with the version input (for example version: v1.2.3), or use the action at a version tag."
          fi
        fi
        if [ "$tag" = latest ]; then
          tag=$(gh release view --repo "$REPO" --json tagName -q .tagName)
        fi
        dir="$RUNNER_TEMP/origami"
        mkdir -p "$dir"
        gh release download "$tag" --repo "$REPO" --pattern "origami-*-${triple}*" --dir "$dir" --clobber
        cd "$dir"
        if command -v sha256sum >/dev/null; then sha256sum -c ./*.sha256; else shasum -a 256 -c ./*.sha256; fi
        bin=$(ls origami-* | grep -v '\.sha256$' | head -1)
        # Build provenance: proves the binary was built by the release
        # workflow of this repository. The sha256 file only guards the
        # download, since it comes from the same release.
        if command -v sha256sum >/dev/null; then digest=$(sha256sum "$bin" | cut -d' ' -f1); else digest=$(shasum -a 256 "$bin" | cut -d' ' -f1); fi
        attestations=$(gh api "repos/${REPO}/attestations/sha256:${digest}" --jq '.attestations | length' 2>/dev/null || echo 0)
        if [ "${attestations:-0}" -gt 0 ]; then
          gh attestation verify "$bin" --repo "$REPO" --signer-workflow "${REPO}/.github/workflows/release.yml"
        elif [ "$REQUIRE_ATTESTATION" = true ]; then
          echo "origami: $bin has no build provenance attestation (require-attestation is set)" >&2
          exit 1
        else
          echo "::warning title=origami::No build provenance attestation found for $bin ($tag). Releases before attestations were added have none; only the sha256 checksum was verified. Set require-attestation to true to refuse such releases."
        fi
        ext=""; [[ "$triple" == *windows* ]] && ext=".exe"
        mv "$bin" "origami$ext"
        chmod +x "origami$ext"
        echo "$dir" >> "$GITHUB_PATH"
        echo "origami $tag ($triple)"

    - name: Run origami
      id: run
      shell: bash
      env:
        ARGS: ${{ inputs.args }}
        SARIF: ${{ inputs.sarif }}
      run: |
        set +e
        if [ "$SARIF" = true ]; then
          origami $ARGS --diagnostics sarif 2> origami.sarif
        else
          origami $ARGS
        fi
        echo "code=$?" >> "$GITHUB_OUTPUT"

    - name: Upload SARIF
      if: always() && inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: origami.sarif
        category: origami

    - name: Result
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.code }}
      run: exit "${CODE:-70}"
