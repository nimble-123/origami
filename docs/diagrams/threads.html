<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checking the whole corpus</title>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Schibsted Grotesk', system-ui, sans-serif; background: #d5d6db; color: #343b58;
           min-height: 100vh; display: flex; align-items: center; justify-content: center;
           padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 800;
          letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    p.caption { color: #565a6e; font-size: 0.9rem; margin-top: 1rem; max-width: 68ch; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>Checking the whole corpus</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="threads-title threads-desc">
        <title id="threads-title">Checking the whole corpus</title>
        <desc id="threads-desc">Bar chart of the time origami needs to check the whole test corpus with 1, 2, 4, 8 and 10 threads: 950 ms, 609 ms, 273 ms, 268 ms, 199 ms.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#565a6e"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34548a"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34548a"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#d5d6db"/>
        <line x1="96" y1="360" x2="920" y2="360" stroke="rgba(52,59,88,0.25)" stroke-width="1"/>
        <text x="88" y="363" fill="#565a6e" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="end">0 ms</text>
        <line x1="96" y1="296" x2="920" y2="296" stroke="rgba(52,59,88,0.08)" stroke-width="0.8"/>
        <text x="88" y="299" fill="#565a6e" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="end">200 ms</text>
        <line x1="96" y1="232" x2="920" y2="232" stroke="rgba(52,59,88,0.08)" stroke-width="0.8"/>
        <text x="88" y="235" fill="#565a6e" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="end">400 ms</text>
        <line x1="96" y1="168" x2="920" y2="168" stroke="rgba(52,59,88,0.08)" stroke-width="0.8"/>
        <text x="88" y="171" fill="#565a6e" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="end">600 ms</text>
        <line x1="96" y1="104" x2="920" y2="104" stroke="rgba(52,59,88,0.08)" stroke-width="0.8"/>
        <text x="88" y="107" fill="#565a6e" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="end">800 ms</text>
        <line x1="96" y1="40" x2="920" y2="40" stroke="rgba(52,59,88,0.08)" stroke-width="0.8"/>
        <text x="88" y="43" fill="#565a6e" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="end">1000 ms</text>
        <rect x="136" y="56" width="88" height="304" fill="rgba(52,59,88,0.06)" stroke="#7c7f8f" stroke-width="1"/>
        <text x="180" y="48" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">950 ms</text>
        <text x="180" y="380" fill="#343b58" font-size="11" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">1 thread</text>
        <rect x="300" y="165" width="88" height="195" fill="rgba(52,59,88,0.06)" stroke="#7c7f8f" stroke-width="1"/>
        <text x="344" y="157" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">609 ms</text>
        <text x="344" y="380" fill="#343b58" font-size="11" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">2 threads</text>
        <rect x="464" y="273" width="88" height="87" fill="rgba(52,59,88,0.06)" stroke="#7c7f8f" stroke-width="1"/>
        <text x="508" y="265" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">273 ms</text>
        <text x="508" y="380" fill="#343b58" font-size="11" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">4 threads</text>
        <rect x="628" y="274" width="88" height="86" fill="rgba(52,59,88,0.06)" stroke="#7c7f8f" stroke-width="1"/>
        <text x="672" y="266" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">268 ms</text>
        <text x="672" y="380" fill="#343b58" font-size="11" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">8 threads</text>
        <rect x="792" y="296" width="88" height="64" fill="rgba(52,84,138,0.10)" stroke="#34548a" stroke-width="1"/>
        <text x="836" y="288" fill="#34548a" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">199 ms</text>
        <text x="836" y="380" fill="#343b58" font-size="11" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">10 threads</text>
        <text x="508" y="404" fill="#565a6e" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">origami --check over 2,147 files, median of 5 runs</text>

      </svg>
    </div>
    <p class="caption">Apple M4 (10 cores), 2026-11-23. By default origami uses one thread per core.</p>
  </div>
</body>
</html>
