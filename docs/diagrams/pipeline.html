<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How origami keeps your code intact</title>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700;800&family=Martian+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Schibsted Grotesk', system-ui, sans-serif; background: #f4f6f9; color: #18214d;
           min-height: 100vh; display: flex; align-items: center; justify-content: center;
           padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    h1 { font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 800;
          letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 1.5rem; }
    p.caption { color: #4a5478; font-size: 0.9rem; margin-top: 1rem; max-width: 68ch; }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
  </style>
</head>
<body>
  <div class="frame">
    <h1>How origami keeps your code intact</h1>
    <div class="diagram-container">
      <svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
        <title id="pipeline-title">How origami keeps your code intact</title>
        <desc id="pipeline-desc">origami lexes the file, lays it out and prints it, then re-lexes the output and compares the tokens with the input; only identical results are written, a unit that differs is kept as written, and if it still differs the file stays unchanged.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4a5478"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2456d6"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2456d6"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#f4f6f9"/>
        <g transform="translate(0,-100)">
        <rect x="512" y="140" width="288" height="236" rx="4" fill="none" stroke="#c9d1de" stroke-width="1" stroke-dasharray="6,4"/>
        <text x="520" y="132" fill="#5b6589" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" letter-spacing="0.04em">self-check, after every format</text>
        <line x1="128" y1="204" x2="166" y2="204" stroke="#4a5478" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="304" y1="204" x2="342" y2="204" stroke="#4a5478" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="488" y1="204" x2="526" y2="204" stroke="#4a5478" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="640" y1="204" x2="658" y2="204" stroke="#4a5478" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="764" y1="204" x2="802" y2="204" stroke="#2456d6" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <line x1="712" y1="248" x2="712" y2="310" stroke="#4a5478" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M644 340 H592 Q584 340 584 332 V234" fill="none" stroke="#4a5478" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="712" y1="368" x2="712" y2="406" stroke="#4a5478" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="768" y="183" width="32" height="12" rx="2" fill="#f4f6f9"/>
        <text x="784" y="192" fill="#2456d6" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">yes</text>
        <rect x="716" y="275" width="24" height="12" rx="2" fill="#f4f6f9"/>
        <text x="722" y="284" fill="#5b6589" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">no</text>
        <rect x="498" y="279" width="80" height="12" rx="2" fill="#f4f6f9"/>
        <text x="572" y="288" fill="#5b6589" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.04em">print again</text>
        <rect x="716" y="389" width="104" height="12" rx="2" fill="#f4f6f9"/>
        <text x="722" y="398" fill="#5b6589" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">still different</text>
        <rect x="24" y="176" width="104" height="56" rx="28" fill="#f4f6f9"/>
        <rect x="24" y="176" width="104" height="56" rx="28" fill="#ffffff" stroke="#18214d" stroke-width="1"/>
        <text x="76" y="202" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Your file</text>
        <text x="76" y="218" fill="#4a5478" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">ABAP or CDS</text>
        <rect x="168" y="176" width="136" height="56" rx="4" fill="#f4f6f9"/>
        <rect x="168" y="176" width="136" height="56" rx="4" fill="#ffffff" stroke="#18214d" stroke-width="1"/>
        <text x="236" y="202" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Lex</text>
        <text x="236" y="218" fill="#4a5478" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">lossless tokens</text>
        <rect x="344" y="176" width="144" height="56" rx="4" fill="#f4f6f9"/>
        <rect x="344" y="176" width="144" height="56" rx="4" fill="#ffffff" stroke="#18214d" stroke-width="1"/>
        <text x="416" y="202" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Parse and lay out</text>
        <text x="416" y="218" fill="#4a5478" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">layout tree</text>
        <rect x="528" y="176" width="112" height="56" rx="4" fill="#f4f6f9"/>
        <rect x="528" y="176" width="112" height="56" rx="4" fill="#ffffff" stroke="#18214d" stroke-width="1"/>
        <text x="584" y="202" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Print</text>
        <text x="584" y="218" fill="#4a5478" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">line width 120</text>
        <polygon points="660,204 712,160 764,204 712,248" fill="#f4f6f9"/>
        <polygon points="660,204 712,160 764,204 712,248" fill="rgba(36,86,214,0.08)" stroke="#2456d6" stroke-width="1.2"/>
        <text x="712" y="200" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Same</text>
        <text x="712" y="216" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">tokens?</text>
        <rect x="804" y="176" width="132" height="56" rx="28" fill="#f4f6f9"/>
        <rect x="804" y="176" width="132" height="56" rx="28" fill="#ffffff" stroke="#18214d" stroke-width="1"/>
        <text x="870" y="202" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Formatted file</text>
        <text x="870" y="218" fill="#4a5478" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">written</text>
        <rect x="644" y="312" width="136" height="56" rx="4" fill="#f4f6f9"/>
        <rect x="644" y="312" width="136" height="56" rx="4" fill="#ffffff" stroke="#18214d" stroke-width="1"/>
        <text x="712" y="338" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Quarantine unit</text>
        <text x="712" y="354" fill="#4a5478" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">keep as written</text>
        <rect x="624" y="408" width="176" height="48" rx="24" fill="#f4f6f9"/>
        <rect x="624" y="408" width="176" height="48" rx="24" fill="#ffffff" stroke="#18214d" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="712" y="430" fill="#18214d" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">File left unchanged</text>
        <text x="712" y="446" fill="#4a5478" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">error X001</text>
        </g>

      </svg>
    </div>
    <p class="caption">After formatting, origami reads its own output back and compares every token and comment with your file. Only whitespace, line breaks and keyword case may differ.</p>
  </div>
</body>
</html>
