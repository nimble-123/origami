        <text x="76" y="218" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">ABAP or CDS</text>
        <rect x="168" y="176" width="136" height="56" rx="4" fill="#0e1430"/>
        <rect x="168" y="176" width="136" height="56" rx="4" fill="#151d42" stroke="#e7ebf6" stroke-width="1"/>
        <text x="236" y="202" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Lex</text>
        <text x="236" y="218" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">lossless tokens</text>
        <rect x="344" y="176" width="144" height="56" rx="4" fill="#0e1430"/>
        <rect x="344" y="176" width="144" height="56" rx="4" fill="#151d42" stroke="#e7ebf6" stroke-width="1"/>
        <text x="416" y="202" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Parse and lay out</text>
        <text x="416" y="218" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">layout tree</text>
        <rect x="528" y="176" width="112" height="56" rx="4" fill="#0e1430"/>
        <rect x="528" y="176" width="112" height="56" rx="4" fill="#151d42" stroke="#e7ebf6" stroke-width="1"/>
        <text x="584" y="202" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Print</text>
        <text x="584" y="218" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">line width 120</text>
        <polygon points="660,204 712,160 764,204 712,248" fill="#0e1430"/>
        <polygon points="660,204 712,160 764,204 712,248" fill="#7fa2ff" stroke="#7fa2ff" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="712" y="200" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Same</text>
        <text x="712" y="216" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">tokens?</text>
        <rect x="804" y="176" width="132" height="56" rx="28" fill="#0e1430"/>
        <rect x="804" y="176" width="132" height="56" rx="28" fill="#151d42" stroke="#e7ebf6" stroke-width="1"/>
        <text x="870" y="202" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Formatted file</text>
        <text x="870" y="218" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">written</text>
        <rect x="644" y="312" width="136" height="56" rx="4" fill="#0e1430"/>
        <rect x="644" y="312" width="136" height="56" rx="4" fill="#151d42" stroke="#e7ebf6" stroke-width="1"/>
        <text x="712" y="338" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Quarantine unit</text>
        <text x="712" y="354" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">keep as written</text>
        <rect x="624" y="408" width="176" height="48" rx="24" fill="#0e1430"/>
        <rect x="624" y="408" width="176" height="48" rx="24" fill="#151d42" stroke="#e7ebf6" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="712" y="430" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">File left unchanged</text>
        <text x="712" y="446" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">error X001</text>
        </g>

      </svg>
