<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 292" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="benchmark-dark-title benchmark-dark-desc" id="benchmark-dark-root">
        <title id="benchmark-dark-title">Formatting the whole test corpus</title>
        <desc id="benchmark-dark-desc">Bar chart of the time to process the test corpus: ABAP Cleaner takes 11.41 s with its default profile; origami takes 0.74 s on one thread and 0.21 s on ten threads.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #benchmark-dark-root { font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #e7ebf6; }
      #benchmark-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #benchmark-dark-root p.caption { color: #aeb6d3; font-size: 0.9rem; margin-top: 1rem; max-width: 68ch; }
      @media print {
#benchmark-dark-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="benchmark-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#aeb6d3"/></marker>
          <marker id="benchmark-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa2ff"/></marker>
          <marker id="benchmark-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7fa2ff"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#0e1430"/>
        <line x1="264" y1="40" x2="264" y2="232" stroke="#e7ebf6" stroke-width="1" stroke-opacity="0.25"/>
        <text x="264" y="252" fill="#aeb6d3" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">0 s</text>
        <line x1="371" y1="40" x2="371" y2="232" stroke="#e7ebf6" stroke-width="0.8" stroke-opacity="0.08"/>
