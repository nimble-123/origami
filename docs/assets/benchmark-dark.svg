        <text x="904" y="252" fill="#aeb6d3" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">12 s</text>
        <rect x="264" y="56" width="609" height="32" fill="#0e1430"/>
        <rect x="264" y="56" width="609" height="32" fill="#e7ebf6" stroke="#7d86a8" stroke-width="1" fill-opacity="0.06"/>
        <text x="252" y="76" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="end">ABAP Cleaner, default profile</text>
        <text x="883" y="76" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace">11.41 s</text>
