        <text x="314" y="136" fill="#7fa2ff" font-size="9" font-family="'Martian Mono', ui-monospace, monospace">0.74 s, 15× faster</text>
        <rect x="264" y="176" width="11" height="32" fill="#0e1430"/>
        <rect x="264" y="176" width="11" height="32" fill="#e7ebf6" stroke="#7d86a8" stroke-width="1" fill-opacity="0.06"/>
        <text x="252" y="196" fill="#e7ebf6" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="end">origami, ten threads</text>
        <text x="285" y="196" fill="#aeb6d3" font-size="9" font-family="'Martian Mono', ui-monospace, monospace">0.21 s</text>
        <text x="584" y="276" fill="#aeb6d3" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">time for the test corpus: ABAP Cleaner 1,920 ABAP files, origami all 2,147 files</text>

      </svg>
