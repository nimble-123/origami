<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 332" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="benchmark-dark-title benchmark-dark-desc" id="benchmark-dark-root">
        <title id="benchmark-dark-title">Formatting a whole project</title>
        <desc id="benchmark-dark-desc">Bar chart of the time to format the 1,920 ABAP files of the test corpus: ABAP Cleaner takes 11.49 s with its default profile and 7.56 s with its layout profile; origami takes 0.94 s on one thread and 0.20 s on 10 threads.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #benchmark-dark-root { font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #c0caf5; }
      #benchmark-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #benchmark-dark-root p.caption { color: #a9b1d6; font-size: 0.9rem; margin-top: 1rem; max-width: 68ch; }
      @media print {
#benchmark-dark-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="benchmark-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a9b1d6"/></marker>
