          <marker id="benchmark-dark-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7aa2f7"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#16161e"/>
