        <text x="584" y="252" fill="#aeb6d3" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">6 s</text>
        <line x1="691" y1="40" x2="691" y2="232" stroke="#e7ebf6" stroke-width="0.8" stroke-opacity="0.08"/>
        <text x="691" y="252" fill="#aeb6d3" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">8 s</text>
        <line x1="797" y1="40" x2="797" y2="232" stroke="#e7ebf6" stroke-width="0.8" stroke-opacity="0.08"/>
