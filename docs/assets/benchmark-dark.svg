        <rect x="264" y="56" width="613" height="32" fill="#c0caf5" stroke="#737aa2" stroke-width="1" fill-opacity="0.06"/>
        <text x="252" y="76" fill="#c0caf5" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="end">ABAP Cleaner, default profile</text>
