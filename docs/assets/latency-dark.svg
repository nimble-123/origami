<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="latency-dark-title latency-dark-desc" id="latency-dark-root">
        <title id="latency-dark-title">How long one call takes</title>
        <desc id="latency-dark-desc">Dumbbell chart, log scale, of the median and 99th percentile time per call: origami in process, through MCP, in WebAssembly and as a new process, and ABAP Cleaner with a warm and with a new JVM.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #latency-dark-root { font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #c0caf5; }
      #latency-dark-root .diagram-container { width: 100%; overflow-x: auto; }
      #latency-dark-root p.caption { color: #a9b1d6; font-size: 0.9rem; margin-top: 1rem; max-width: 68ch; }
      @media print {
#latency-dark-root .diagram-container { overflow-x: visible; }
}</style>
