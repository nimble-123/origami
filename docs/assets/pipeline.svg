<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc" id="pipeline-root">
        <title id="pipeline-title">How origami keeps your code intact</title>
        <desc id="pipeline-desc">origami lexes the file, lays it out and prints it, then re-lexes the output and compares the tokens with the input; only identical results are written, a unit that differs is kept as written, and if it still differs the file stays unchanged.</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #pipeline-root { font-family: 'Schibsted Grotesk', system-ui, sans-serif; color: #343b58; }
      #pipeline-root .diagram-container { width: 100%; overflow-x: auto; }
      #pipeline-root p.caption { color: #565a6e; font-size: 0.9rem; margin-top: 1rem; max-width: 68ch; }
      @media print {
#pipeline-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="pipeline-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#565a6e"/></marker>
          <marker id="pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34548a"/></marker>
          <marker id="pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#34548a"/></marker>
        </defs>
        <rect width="100%" height="100%" fill="#d5d6db"/>
        <g transform="translate(0,-100)">
        <rect x="512" y="140" width="288" height="236" rx="4" fill="none" stroke="#a8aab6" stroke-width="1" stroke-dasharray="6,4"/>
        <text x="520" y="132" fill="#5f6272" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" letter-spacing="0.04em">self-check, after every format</text>
        <line x1="128" y1="204" x2="166" y2="204" stroke="#565a6e" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
        <line x1="304" y1="204" x2="342" y2="204" stroke="#565a6e" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
        <line x1="488" y1="204" x2="526" y2="204" stroke="#565a6e" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
        <line x1="640" y1="204" x2="658" y2="204" stroke="#565a6e" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
        <line x1="764" y1="204" x2="802" y2="204" stroke="#34548a" stroke-width="1.2" marker-end="url(#pipeline-arrow-accent)"/>
        <line x1="712" y1="248" x2="712" y2="310" stroke="#565a6e" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
        <path d="M644 340 H592 Q584 340 584 332 V234" fill="none" stroke="#565a6e" stroke-width="1" marker-end="url(#pipeline-arrow)"/>
        <line x1="712" y1="368" x2="712" y2="406" stroke="#565a6e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#pipeline-arrow)"/>
        <rect x="768" y="183" width="32" height="12" rx="2" fill="#d5d6db"/>
        <text x="784" y="192" fill="#34548a" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.04em">yes</text>
        <rect x="716" y="275" width="24" height="12" rx="2" fill="#d5d6db"/>
        <text x="722" y="284" fill="#5f6272" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">no</text>
        <rect x="498" y="279" width="80" height="12" rx="2" fill="#d5d6db"/>
        <text x="572" y="288" fill="#5f6272" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="end" letter-spacing="0.04em">print again</text>
        <rect x="716" y="389" width="104" height="12" rx="2" fill="#d5d6db"/>
        <text x="722" y="398" fill="#5f6272" font-size="8" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="start" letter-spacing="0.04em">still different</text>
        <rect x="24" y="176" width="104" height="56" rx="28" fill="#d5d6db"/>
        <rect x="24" y="176" width="104" height="56" rx="28" fill="#e6e7ed" stroke="#343b58" stroke-width="1"/>
        <text x="76" y="202" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Your file</text>
        <text x="76" y="218" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">ABAP or CDS</text>
        <rect x="168" y="176" width="136" height="56" rx="4" fill="#d5d6db"/>
        <rect x="168" y="176" width="136" height="56" rx="4" fill="#e6e7ed" stroke="#343b58" stroke-width="1"/>
        <text x="236" y="202" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Lex</text>
        <text x="236" y="218" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">lossless tokens</text>
        <rect x="344" y="176" width="144" height="56" rx="4" fill="#d5d6db"/>
        <rect x="344" y="176" width="144" height="56" rx="4" fill="#e6e7ed" stroke="#343b58" stroke-width="1"/>
        <text x="416" y="202" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Parse and lay out</text>
        <text x="416" y="218" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">layout tree</text>
        <rect x="528" y="176" width="112" height="56" rx="4" fill="#d5d6db"/>
        <rect x="528" y="176" width="112" height="56" rx="4" fill="#e6e7ed" stroke="#343b58" stroke-width="1"/>
        <text x="584" y="202" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Print</text>
        <text x="584" y="218" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">line width 120</text>
        <polygon points="660,204 712,160 764,204 712,248" fill="#d5d6db"/>
        <polygon points="660,204 712,160 764,204 712,248" fill="#34548a" stroke="#34548a" stroke-width="1.2" fill-opacity="0.10"/>
        <text x="712" y="200" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Same</text>
        <text x="712" y="216" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">tokens?</text>
        <rect x="804" y="176" width="132" height="56" rx="28" fill="#d5d6db"/>
        <rect x="804" y="176" width="132" height="56" rx="28" fill="#e6e7ed" stroke="#343b58" stroke-width="1"/>
        <text x="870" y="202" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Formatted file</text>
        <text x="870" y="218" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">written</text>
        <rect x="644" y="312" width="136" height="56" rx="4" fill="#d5d6db"/>
        <rect x="644" y="312" width="136" height="56" rx="4" fill="#e6e7ed" stroke="#343b58" stroke-width="1"/>
        <text x="712" y="338" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">Quarantine unit</text>
        <text x="712" y="354" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">keep as written</text>
        <rect x="624" y="408" width="176" height="48" rx="24" fill="#d5d6db"/>
        <rect x="624" y="408" width="176" height="48" rx="24" fill="#e6e7ed" stroke="#343b58" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="712" y="430" fill="#343b58" font-size="12" font-weight="600" font-family="'Schibsted Grotesk', system-ui, sans-serif" text-anchor="middle">File left unchanged</text>
        <text x="712" y="446" fill="#565a6e" font-size="9" font-family="'Martian Mono', ui-monospace, monospace" text-anchor="middle">error X001</text>
        </g>

      </svg>
