<svg viewBox="0 0 960 434" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="granularity-dark-title granularity-dark-desc" id="granularity-dark-root">
        <title id="granularity-dark-title">One statement, one method, one file</title>
        <desc id="granularity-dark-desc">Dot plot, log scale, of the median time per call for origami and ABAP Cleaner with its layout and its default profile. Warm, one statement: origami 3.8 µs, ABAP Cleaner 82 µs and 141 µs; one file: origami 113 µs, ABAP Cleaner 1.3 ms and 2.0 ms. Cold, a new process per call, one file: origami 1.9 ms, ABAP Cleaner 292 ms and 349 ms.</desc>
