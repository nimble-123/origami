[workspace]
resolver = "3"
members = [
    "crates/origami_syntax",
    "crates/origami_layout",
    "crates/origami_abap",
    "crates/origami_cds",
    "crates/origami_core",
    "crates/origami_cli",
    "xtask",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.94"

[workspace.dependencies]
origami_syntax = { path = "crates/origami_syntax", version = "0.1.0" }
origami_layout = { path = "crates/origami_layout", version = "0.1.0" }
origami_abap = { path = "crates/origami_abap", version = "0.1.0" }
origami_cds = { path = "crates/origami_cds", version = "0.1.0" }
origami_core = { path = "crates/origami_core", version = "0.1.0" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
clap = { version = "4.6", features = ["derive", "env"] }
toml = "1.2"
semver = "1.0"
ignore = "0.4"
rayon = "1.12"
tempfile = "3.27"
similar = "3.2"
criterion = "0.8"
assert_cmd = "2.2"
jsonschema = "0.62"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
