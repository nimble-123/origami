# Test corpus. `cargo xtask corpus fetch` clones each repository at the pinned
# commit into corpus/repos/<name>/ (never committed). The `modern` flag selects
# the files counted for the M1 exit criterion. `commit` is the default-branch
# HEAD on the M0 start date (2026-11-21). For abap-platform-refscen-flight the
# sources live on release branches, so the `ABAP-platform-cloud` branch is used.

[[repo]]
name = "abapGit"
url = "https://github.com/abapGit/abapGit"
commit = "ab9919e4e1157807ca6b456832aa79cbf0301857"
spdx = "MIT"
include = ["src/**"]
modern = false

