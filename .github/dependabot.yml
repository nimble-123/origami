# Weekly dependency updates, one grouped pull request per ecosystem. Titles
# are Conventional Commits (see .github/workflows/pr-title.yml); the "deps"
# scope is one of the allowed scopes. Updates to GitHub Actions keep the full
# commit SHA and rewrite the "# vX.Y.Z" comment next to it.
version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-fuzz:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /editors/vscode
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-vscode:
        patterns: ["*"]
    ignore:
      # Tied to the minimum VS Code version (`engines.vscode`); vsce rejects
      # a package whose @types/vscode is newer. Raise both together by hand.
      - dependency-name: "@types/vscode"
      # Should match the Node version that ships with that VS Code.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # A new TypeScript major waits until typescript-eslint supports it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /tools/abaplint-oracle
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-abaplint-oracle:
        patterns: ["*"]

  # "/" covers the workflows in .github/workflows and the root action.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]
