name: Website

# Builds site/ (static page, diagrams, origami as WebAssembly) and deploys it
# to GitHub Pages: https://nimble-123.github.io/origami/

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/assets/**"
      - "crates/**"
      - "Cargo.lock"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - run: rustup target add wasm32-unknown-unknown
      - run: sh site/build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
