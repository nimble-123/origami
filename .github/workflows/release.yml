name: Release

# Triggered by a version tag (vX.Y.Z), which release-please creates when its
# release pull request is merged. All crates and the VS Code extension share
# one version. Steps that need secrets (signing, publishing) are skipped
# when the secret is not set, so a dry run on a fork still produces the
# GitHub release assets.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
      APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      WINDOWS_CERT_PFX: ${{ secrets.WINDOWS_CERT_PFX }}
      WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, os: macos-14, tool: cargo, vscode: darwin-x64 }
          - { target: aarch64-apple-darwin, os: macos-14, tool: cargo, vscode: darwin-arm64 }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, tool: cargo, vscode: win32-x64 }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, tool: cargo, vscode: win32-arm64 }
          - { target: x86_64-unknown-linux-gnu.2.17, os: ubuntu-latest, tool: zigbuild, vscode: linux-x64 }
          - { target: aarch64-unknown-linux-gnu.2.17, os: ubuntu-latest, tool: zigbuild, vscode: linux-arm64 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, tool: zigbuild, vscode: alpine-x64 }
    steps:
      - uses: actions/checkout@v4
      - name: Rust target
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        # zigbuild targets carry a glibc suffix that rustup does not know.
        run: rustup target add "${TARGET%.2.17}"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        run: |
          pip install ziglang
          cargo install cargo-zigbuild --locked
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.tool }}" = zigbuild ]; then
            cargo zigbuild --release --locked -p abap-origami --target "${{ matrix.target }}"
          else
            cargo build --release --locked -p abap-origami --target "${{ matrix.target }}"
          fi
      - name: Collect binary
        id: collect
        shell: bash
        run: |
          triple="${{ matrix.target }}"; triple="${triple%.2.17}"
          ext=""; [[ "$triple" == *windows* ]] && ext=".exe"
          version="${GITHUB_REF_NAME#v}"
          name="origami-${version}-${triple}${ext}"
          mkdir -p dist
          cp "target/${triple}/release/origami${ext}" "dist/${name}"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "ext=${ext}" >> "$GITHUB_OUTPUT"
      - name: Sign (macOS)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        run: |
          echo "$APPLE_CERT_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain
          identity=$(security find-identity -v -p codesigning build.keychain | head -1 | awk '{print $2}')
          codesign --force --options runtime --timestamp --sign "$identity" "dist/${{ steps.collect.outputs.name }}"
          echo "$APPLE_API_KEY" > key.p8
          ditto -c -k "dist/${{ steps.collect.outputs.name }}" notarize.zip
          xcrun notarytool submit notarize.zip --key key.p8 --key-id "$APPLE_API_KEY_ID" --issuer "$APPLE_API_ISSUER" --wait
      - name: Sign (Windows)
        if: runner.os == 'Windows' && env.WINDOWS_CERT_PFX != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:WINDOWS_CERT_PFX))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:WINDOWS_CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\${{ steps.collect.outputs.name }}"
      - name: Checksum
        shell: bash
        run: |
          cd dist
          if command -v sha256sum >/dev/null; then sha256sum "${{ steps.collect.outputs.name }}" > "${{ steps.collect.outputs.name }}.sha256";
          else shasum -a 256 "${{ steps.collect.outputs.name }}" > "${{ steps.collect.outputs.name }}.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.vscode }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bin-*
          merge-multiple: true
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Third-party notices
        run: |
          cargo about generate about.hbs > THIRD_PARTY_NOTICES.generated.md
          cat THIRD_PARTY_NOTICES.md THIRD_PARTY_NOTICES.generated.md > artifacts/THIRD_PARTY_NOTICES.md
      - name: Release diff against the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cargo xtask corpus fetch
          cargo xtask release-diff || true
          [ -f target/release-diff.patch ] && cp target/release-diff.patch artifacts/ || true
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        # release-please normally created the release (with its changelog
        # section) together with the tag; then only the assets are added.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "origami $GITHUB_REF_NAME" \
              --notes "See CHANGELOG.md. Checksums: *.sha256. Output changes on the test corpus: release-diff.patch."
          fi

  homebrew:
    # Writes Formula/origami.rb to nimble-123/homebrew-tap. Needs a token with
    # write access to that repository (secret HOMEBREW_TAP_TOKEN).
    needs: release
    runs-on: ubuntu-latest
    env:
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
      - uses: actions/download-artifact@v4
        if: env.HOMEBREW_TAP_TOKEN != ''
        with:
          path: artifacts
          pattern: bin-*
          merge-multiple: true
      - name: Update the formula in the tap
        if: env.HOMEBREW_TAP_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          sh scripts/homebrew-formula.sh "$version" artifacts > origami.rb
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/nimble-123/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp origami.rb tap/Formula/origami.rb
          cd tap
          git config user.name "origami release"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/origami.rb
          git diff --cached --quiet || git commit -m "origami ${version}"
          git push

  crates:
    needs: release
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Publish crates in dependency order
        if: env.CARGO_REGISTRY_TOKEN != ''
        run: |
          for crate in origami_syntax origami_layout origami_abap origami_cds origami_core abap-origami; do
            cargo publish --locked -p "$crate"
            sleep 30
          done

  vscode:
    needs: release
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        vscode: [darwin-x64, darwin-arm64, win32-x64, win32-arm64, linux-x64, linux-arm64, alpine-x64]
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: bin-${{ matrix.vscode }}
          path: bin-in
      - name: Package VSIX
        working-directory: editors/vscode
        run: |
          npm ci
          npm run build
          mkdir -p bin
          src=$(ls ../../bin-in/origami-* | grep -v '\.sha256$' | head -1)
          case "$src" in *.exe) cp "$src" bin/origami.exe ;; *) cp "$src" bin/origami && chmod +x bin/origami ;; esac
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npx vsce package --target "${{ matrix.vscode }}" --no-dependencies
      - name: Publish to VS Code Marketplace
        if: env.VSCE_PAT != ''
        working-directory: editors/vscode
        run: npx vsce publish --packagePath *.vsix --pat "$VSCE_PAT"
      - name: Publish to Open VSX
        if: env.OVSX_PAT != ''
        working-directory: editors/vscode
        run: npx --yes ovsx publish *.vsix --pat "$OVSX_PAT"
      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.vscode }}
          path: editors/vscode/*.vsix
      - name: Attach the VSIX to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" editors/vscode/*.vsix --clobber
