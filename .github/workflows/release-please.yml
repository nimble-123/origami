name: release-please

# Keeps a release pull request open that bumps the version and updates
# CHANGELOG.md from Conventional Commits. Merging it tags vX.Y.Z and creates
# the GitHub release; the tag starts release.yml (binaries, Homebrew, VS Code).
#
# RELEASE_PLEASE_TOKEN: a token with contents and pull-request write access.
# With the default token, the tag would not start release.yml.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # The release PR bumps the workspace version in Cargo.toml; bring
      # Cargo.lock along, or `cargo build --locked` fails at release time.
      - uses: actions/checkout@v4
        if: steps.rp.outputs.pr
        with:
          ref: ${{ fromJSON(steps.rp.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
      - name: Update Cargo.lock in the release PR
        if: steps.rp.outputs.pr
        run: |
          cargo update --workspace
          if ! git diff --quiet Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "chore: update Cargo.lock for the release"
            git push
          fi
