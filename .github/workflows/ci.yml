name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p origami_core --features fault-injection

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov
      - run: cargo deny check
      # Workspace-wide: the language crates are tested through the rule
      # harness and CLI tests in other crates, on purpose.
      - name: Coverage
        run: >
          cargo llvm-cov --workspace --exclude xtask
          --features origami_core/fault-injection --fail-under-lines 85

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine
      - run: cargo xtask corpus fetch
      - run: cargo xtask corpus run
      - name: Line-break explanations (checks a-d)
        run: cargo xtask explain --corpus
      - name: Mutation stress test (stable Rust)
        run: cargo xtask stress 20000 ${{ github.run_number }}
      - run: npm ci
        working-directory: tools/abaplint-oracle
      - run: cargo xtask oracle
      - run: cargo bench -p origami_core
      - run: scripts/bench-cli.sh

  # The compiler channels a user might build with, next to the pinned
  # toolchain of the `test` job. Beta is an early warning, not a gate.
  toolchains:
    name: test (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: cargo +${{ matrix.toolchain }} test --workspace

  # origami_wasm for the browser: the build site.yml deploys, and the C ABI
  # (alloc, review, dealloc) called from Node like the playground worker does.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: rustup target add wasm32-unknown-unknown
      - run: sh site/build.sh
      - run: node crates/origami_wasm/tests/smoke.mjs site/dist/origami.wasm

  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p abap-origami
      - name: Install, unit tests, bundle
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          npm run build
      - name: Lint and typecheck
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Bundle the origami binary
        shell: bash
        working-directory: editors/vscode
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = Windows ]; then exe=origami.exe; else exe=origami; fi
          cp "../../target/release/$exe" "bin/$exe"
      - name: End-to-end tests in VS Code (Linux, needs a display)
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end tests in VS Code
        if: runner.os != 'Linux'
        working-directory: editors/vscode
        run: npm run test:e2e
      - name: Package VSIX (linux-x64)
        if: runner.os == 'Linux'
        working-directory: editors/vscode
        run: npx vsce package --target linux-x64 --no-dependencies --allow-missing-repository
