name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Decides whether a change touches code. The docs filter sits at job and step
  # level, not in `on.paths-ignore`: the ruleset requires the checks `test (...)`,
  # `quality`, `corpus` and `extension`, and a workflow that never starts leaves
  # them pending. A skipped job counts as passed. The matrix jobs (`test`,
  # `extension-os`) must stay, so that the expanded check names exist; they skip
  # their steps instead.
  # Docs-only: every changed file is under site/ (except site/build.sh, which
  # the wasm job runs), docs/ (except docs/STYLE.md, which tests read), is a
  # Markdown file outside the code folders (crates/, xtask/, fuzz/, editors/,
  # corpus/), LICENSE*, scripts/abap-cleaner-compare/ or .github/ISSUE_TEMPLATE/.
  # Everything else is code. A second output, `wasm`, is also true when a
  # changed file is under site/ or docs/assets/: site/build.sh copies
  # site/{index.html,abap-cleaner.html,style.css,*.js,samples/*,vendor/*} and files
  # from docs/assets/, so renaming or deleting one must run the `wasm` job,
  # which builds the site. If this job fails, the
  # jobs below still run (`!= 'false'`), never a silent skip.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      wasm: ${{ steps.filter.outputs.wasm }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          code=true
          wasm=true
          if [ "$EVENT" = pull_request ] \
            && git diff -z --name-only --no-renames "$BASE_SHA...$HEAD_SHA" > "$RUNNER_TEMP/files"; then
            code=false
            wasm=false
            count=0
            while IFS= read -r -d '' file; do
              count=$((count + 1))
              case "$file" in
                docs/STYLE.md | site/build.sh | crates/* | xtask/* | fuzz/* | editors/* | corpus/*) code=true; break ;;
                site/* | docs/assets/*) wasm=true ;;
                docs/* | *.md | LICENSE* | scripts/abap-cleaner-compare/* | .github/ISSUE_TEMPLATE/*) ;;
                *) code=true; break ;;
              esac
            done < "$RUNNER_TEMP/files"
            if [ "$count" -eq 0 ]; then code=true; fi
            if [ "$code" = true ]; then wasm=true; fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "wasm=$wasm" >> "$GITHUB_OUTPUT"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.code != 'false'
      - run: cargo fmt --all --check
        if: needs.changes.outputs.code != 'false'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: needs.changes.outputs.code != 'false'
      - run: cargo test --workspace
        if: needs.changes.outputs.code != 'false'
      - run: cargo test -p origami_core --features fault-injection
        if: needs.changes.outputs.code != 'false'

  quality:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny,cargo-llvm-cov
      - run: cargo deny check
      # Workspace-wide: the language crates are tested through the rule
      # harness and CLI tests in other crates, on purpose.
      - name: Coverage
        run: >
          cargo llvm-cov --workspace --exclude xtask
          --features origami_core/fault-injection --fail-under-lines 85

  corpus:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: hyperfine
      - run: cargo xtask corpus fetch
      - run: cargo xtask corpus run
      - name: Line-break explanations (checks a-d)
        run: cargo xtask explain --corpus
      - name: Mutation stress test (stable Rust)
        run: cargo xtask stress 20000 ${{ github.run_number }}
      - run: npm ci
        working-directory: tools/abaplint-oracle
      - run: cargo xtask oracle
      - run: cargo bench -p origami_core
      - run: scripts/bench-cli.sh

  # The compiler channels a user might build with, next to the pinned
  # toolchain of the `test` job. Beta is an early warning, not a gate.
  toolchains:
    name: toolchain (${{ matrix.toolchain }})
    strategy:
      fail-fast: false
      matrix:
        toolchain: [stable, beta]
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    continue-on-error: ${{ matrix.toolchain == 'beta' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal
      - run: cargo +${{ matrix.toolchain }} test --workspace

  # origami_wasm for the browser: the build site.yml deploys, and the C ABI
  # (alloc, review, dealloc) called from Node like the playground worker does.
  wasm:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.wasm != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: wasm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: rustup target add wasm32-unknown-unknown
      - run: sh site/build.sh
      - run: node crates/origami_wasm/tests/smoke.mjs site/dist/origami.wasm

  # The composite action (action.yml) against a released binary: download,
  # checksum, attestation, run. Read-only and without secrets: the action only
  # reads the public release with the workflow token, which a pull request
  # from a fork has as well. The version is pinned on purpose, so that a new
  # release cannot fail unrelated pull requests; raise it by hand when the
  # action needs a newer binary.
  action:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./
        with:
          version: v0.4.2
          args: --check --no-config tests/action-fixture
      - name: The pinned binary is the one that runs
        run: origami --version | grep -q '^origami 0\.4\.2 '

  extension-os:
    name: extension (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: changes
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.code != 'false'
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: needs.changes.outputs.code != 'false'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: needs.changes.outputs.code != 'false'
        with:
          node-version: 22
      - run: cargo build --release -p abap-origami
        if: needs.changes.outputs.code != 'false'
      - name: Install, unit tests, bundle
        if: needs.changes.outputs.code != 'false'
        working-directory: editors/vscode
        run: |
          npm ci
          npm test
          npm run build
      - name: Lint and typecheck
        if: needs.changes.outputs.code != 'false' && runner.os == 'Linux'
        working-directory: editors/vscode
        run: |
          npm run lint
          npx tsc --noEmit
      - name: Bundle the origami binary
        if: needs.changes.outputs.code != 'false'
        shell: bash
        working-directory: editors/vscode
        run: |
          mkdir -p bin
          if [ "$RUNNER_OS" = Windows ]; then exe=origami.exe; else exe=origami; fi
          cp "../../target/release/$exe" "bin/$exe"
      - name: End-to-end tests in VS Code (Linux, needs a display)
        if: needs.changes.outputs.code != 'false' && runner.os == 'Linux'
        working-directory: editors/vscode
        run: xvfb-run -a npm run test:e2e
      - name: End-to-end tests in VS Code
        if: needs.changes.outputs.code != 'false' && runner.os != 'Linux'
        working-directory: editors/vscode
        run: npm run test:e2e
      - name: Package VSIX (linux-x64)
        if: needs.changes.outputs.code != 'false' && runner.os == 'Linux'
        working-directory: editors/vscode
        run: npx vsce package --target linux-x64 --no-dependencies --allow-missing-repository

  # The required check `extension`: passes when the extension passed on every
  # operating system.
  extension:
    needs: extension-os
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ needs.extension-os.result }}" = success
