name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p origami_core --features fault-injection

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny,cargo-llvm-cov
      - run: cargo deny check
      - name: Coverage per crate
        run: |
          cargo llvm-cov -p origami_syntax --fail-under-lines 85
          cargo llvm-cov -p origami_layout --fail-under-lines 85
          cargo llvm-cov -p origami_core --features fault-injection --fail-under-lines 85
          cargo llvm-cov -p origami_abap --fail-under-lines 75
          cargo llvm-cov -p origami_cds --fail-under-lines 75

  corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: taiki-e/install-action@v2
        with:
          tool: hyperfine
      - run: cargo xtask corpus fetch
      - run: cargo xtask corpus run
      - name: Mutation stress test (stable Rust)
        run: cargo xtask stress 20000 ${{ github.run_number }}
      - run: npm ci
        working-directory: tools/abaplint-oracle
      - run: cargo xtask oracle
      - run: cargo bench -p origami_core
      - run: scripts/bench-cli.sh

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --release -p abap-origami
      - name: Typecheck, unit tests, bundle
        working-directory: editors/vscode
        run: |
          npm ci
          npx tsc --noEmit
          npm test
          npm run build
      - name: Package VSIX (linux-x64)
        working-directory: editors/vscode
        run: |
          mkdir -p bin && cp ../../target/release/origami bin/origami
          npx vsce package --target linux-x64 --no-dependencies --allow-missing-repository
