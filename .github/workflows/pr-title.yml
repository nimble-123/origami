name: PR title

# Pull requests are squash-merged; their title becomes the commit on main and
# feeds release-please. It must be a Conventional Commit (see CONTRIBUTING.md).

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            style
            refactor
            test
            docs
            build
            ci
            chore
          scopes: |
            abap
            cds
            core
            layout
            cli
            mcp
            vscode
            wasm
            site
            xtask
            release
            deps
            deps-dev
            main
          requireScope: false
