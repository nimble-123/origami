<!doctype html>
<html><head><meta charset="utf-8">
<!-- The link preview (docs/assets/social-preview.png): render this page with a
     headless browser at 1280x640, e.g. puppeteer's page.screenshot. The look
     is the website's (docs/brand.md): the dark ground, a cone of light from
     the top, a faint grid, the headline in Inter with its white-to-slate
     gradient. -->
<style>
  @font-face { font-family: "Inter"; src: url(../fonts/inter-latin.woff2) format("woff2"); font-weight: 400 700; }
  @font-face { font-family: "Geist Mono"; src: url(../fonts/geist-mono-latin.woff2) format("woff2"); font-weight: 400 600; }
  html,body{margin:0;width:1280px;height:640px;overflow:hidden;background:#0d0e14;color:#c0caf5;-webkit-font-smoothing:antialiased;font-family:Inter,sans-serif}
  .grid{position:absolute;inset:0;background-image:linear-gradient(rgba(192,202,245,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(192,202,245,.05) 1px,transparent 1px);background-size:64px 64px;background-position:center top;-webkit-mask-image:radial-gradient(ellipse 60% 70% at 50% 20%,#000 20%,transparent 75%)}
  .cone{position:absolute;left:50%;top:-360px;width:1200px;height:900px;transform:translateX(-50%);background:conic-gradient(from 180deg at 50% 0%,transparent 150deg,rgba(122,162,247,.42) 172deg,rgba(187,154,247,.5) 180deg,rgba(125,207,255,.38) 188deg,transparent 210deg);filter:blur(46px)}
  .wrap{position:relative;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;text-align:center}
  .brand{display:flex;align-items:center;gap:14px;font:600 30px/1 Inter;color:#fff;letter-spacing:-.01em}
  h1{margin:0;font:600 86px/1.02 Inter;letter-spacing:-.045em;background:linear-gradient(180deg,#fff 30%,#a9b1d6);-webkit-background-clip:text;background-clip:text;color:transparent}
  .foot{font:400 28px/1.4 Inter;color:#a9b1d6}
  code{font:500 22px "Geist Mono";color:#c0caf5;padding:10px 18px;border-radius:12px;background:rgba(22,22,30,.85);box-shadow:inset 0 0 0 1px rgba(192,202,245,.2);font-variant-ligatures:none}
  code b{color:#7aa2f7;font-weight:500}
</style></head><body>
<div class="grid"></div><div class="cone"></div>
<div class="wrap">
  <div class="brand"><img src="../../docs/assets/logo-small-dark.svg" width="44" height="44" alt="">origami</div>
  <h1>Format ABAP.<br>Change nothing else.</h1>
  <div class="foot">The layout-only formatter for ABAP and CDS, checked token by token.</div>
  <code><b>$</b> brew install nimble-123/tap/origami</code>
</div>
</body></html>
